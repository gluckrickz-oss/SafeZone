name: Linux release assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-linux.yml
      - scripts/package-linux.sh
      - package.json
      - package-lock.json
      - main.js
      - preload.js
      - src/**
      - lib/**
      - README.md
      - SECURITY.md
      - CHANGELOG.md

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Download Electron Linux binary
        run: node node_modules/electron/install.js
      - name: Audit dependencies
        run: npm run audit
      - name: Package Linux application
        run: npm run package:linux
      - name: Upload assets to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          name="safezone-${version}-linux-x64"
          for attempt in $(seq 1 60); do
            if gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          gh release upload "v${version}" "build/${name}.tar.gz" "build/${name}.tar.gz.sha256" --clobber --repo "${GITHUB_REPOSITORY}"
          gh release edit "v${version}" --title "SafeZone ${version} para Linux e Windows" --notes-file CHANGELOG.md --repo "${GITHUB_REPOSITORY}"
