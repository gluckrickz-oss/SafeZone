name: Windows release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - scripts/package-windows.js
      - scripts/safezone.iss
      - .github/workflows/release-windows.yml
      - main.js
      - preload.js
      - src/**
      - lib/**
      - README.md
      - SECURITY.md
      - CHANGELOG.md

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Download Electron Windows binary
        shell: bash
        run: node node_modules/electron/install.js
      - name: Audit dependencies
        run: npm run audit
      - name: Check JavaScript syntax
        shell: bash
        run: node --check main.js && node --check preload.js && node --check lib/pulse.js && node --check src/app.js && node --check src/audio-worklet.js && node --check scripts/sbom.js && node --check scripts/vendor.js && node --check scripts/package-windows.js
      - name: Package Windows application
        run: npm run package:windows
      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $name = "safezone-$version-windows-x64"
          $folder = "build/$name"
          $zip = "build/$name.zip"
          Compress-Archive -Path "$folder/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -Path "$zip.sha256" -Encoding ascii
      - name: Build per-user installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $version = node -p "require('./package.json').version"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "scripts/safezone.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "build/safezone-$version-windows-x64-setup.exe"
          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -Path ($installer + ".sha256") -Encoding ascii
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $name = "safezone-$version-windows-x64"
          $installer = "build/safezone-$version-windows-x64-setup.exe"
          $tag = "v$version"
          gh release create $tag "build/$name.zip" "build/$name.zip.sha256" $installer ($installer + ".sha256") --target $env:GITHUB_SHA --title "SafeZone $version para Windows" --notes-file CHANGELOG.md --repo $env:GITHUB_REPOSITORY
